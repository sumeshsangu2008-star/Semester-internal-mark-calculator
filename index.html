<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semester CIA Internal Mark Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --green: #0f4a3a;
    --green-dark: #0a3429;
    --gold: #c9972b;
    --navy: #1f2c73;
    --bg: #eef2f1;
    --card: #ffffff;
    --text: #1d2a27;
    --muted: #64748b;
    --line: #dbe3e0;
    --ok: #0b7a4b;
}

* { box-sizing: border-box; }

body {
    font-family: "Poppins", "Noto Sans Tamil", Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg) 0%, #dfe9e6 100%);
    color: var(--text);
    margin: 0;
    padding: 20px 14px 40px;
    min-height: 100vh;
}

.container {
    max-width: 1200px;
    margin: auto;
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(15, 74, 58, .15);
    overflow: hidden;
}

/* Header */
.header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 26px 20px;
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    border-bottom: 4px solid var(--gold);
    color: #fff;
}

.logo {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    background: #fff;
    border: 3px solid var(--gold);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
}

.university-name {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: .5px;
}

.subtitle {
    font-size: 13px;
    color: #e7d8aa;
    margin-top: 2px;
}

.content { padding: 8px 24px 28px; }

h1 {
    text-align: center;
    color: var(--green);
    font-size: 24px;
    font-weight: 600;
    margin: 26px 0 20px;
}

/* Table */
.table-box {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
}

table {
    width: 100%;
    min-width: 1100px;
    border-collapse: collapse;
}

th, td {
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
}

th:last-child, td:last-child { border-right: none; }
tbody tr:last-child td { border-bottom: none; }

thead th {
    background: var(--green);
    color: #fff;
    font-weight: 500;
    font-size: 14px;
    border-color: rgba(255, 255, 255, .2);
}

thead tr:nth-child(2) th {
    background: var(--navy);
    font-size: 12.5px;
}

tbody tr:nth-child(even) { background: #f6faf9; }
tbody tr:hover { background: #fff7e0; }

input {
    width: 78px;
    padding: 9px 6px;
    font: inherit;
    font-size: 14px;
    text-align: center;
    border: 1px solid #b9c6c2;
    border-radius: 8px;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
}

input:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201, 151, 43, .25);
}

input.subject {
    width: 160px;
    text-align: left;
    padding-left: 10px;
}

.result {
    color: var(--ok);
    font-weight: 600;
    min-width: 210px;
}

.result .mark { font-size: 16px; white-space: nowrap; }

.result .tamil {
    margin-top: 4px;
    font-family: "Noto Sans Tamil", "Poppins", sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--navy);
    line-height: 1.5;
}

/* Buttons */
.buttons {
    text-align: center;
    margin: 24px 0 8px;
}

button {
    font: inherit;
    font-weight: 500;
    font-size: 15px;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    margin: 5px;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s;
}

button:hover { transform: translateY(-2px); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.calculate {
    background: linear-gradient(135deg, var(--green), var(--navy));
    color: #fff;
    box-shadow: 0 4px 12px rgba(31, 44, 115, .3);
}

.reset {
    background: #fff;
    color: #c62828;
    border: 2px solid #c62828;
}

.reset:hover { background: #fdecec; }


/* Login screen */
#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.login-card {
    width: 100%;
    max-width: 400px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(15, 74, 58, .2);
    overflow: hidden;
}
.login-head {
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    border-bottom: 4px solid var(--gold);
    color: #fff;
    text-align: center;
    padding: 26px 20px;
}
.login-head .logo { margin: 0 auto 10px; display: block; }
.login-head h2 { margin: 0; font-size: 21px; }
.login-head p { margin: 4px 0 0; font-size: 13px; color: #e7d8aa; font-family: "Noto Sans Tamil", "Poppins", sans-serif; }
.login-body { padding: 24px; }
.login-body label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
.login-body input { width: 100%; padding: 11px 12px; text-align: left; font-size: 15px; }
.login-body button { width: 100%; margin: 20px 0 0; background: linear-gradient(135deg, var(--green), var(--navy)); color: #fff; }
.login-error { color: #c62828; font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; font-family: "Noto Sans Tamil", "Poppins", sans-serif; }
.logout-bar { text-align: right; padding: 12px 24px 0; }
.logout-bar button { margin: 0; padding: 8px 18px; font-size: 13px; background: #fff; color: var(--green); border: 2px solid var(--green); }
#app { display: none; }

@media (max-width: 700px) {
    .university-name { font-size: 20px; }
    .logo { width: 68px; height: 68px; }
    h1 { font-size: 19px; }
    .content { padding: 4px 12px 22px; }
}
</style>
</head>

<body>

<!-- Login -->
<div id="loginScreen">
    <form class="login-card" id="loginForm" autocomplete="off">
        <div class="login-head">
            <img class="logo" alt="Thiruvalluvar University logo">
            <h2>Thiruvalluvar University</h2>
            <p>உள்நுழைய உங்கள் விவரங்களை உள்ளிடவும்</p>
        </div>
        <div class="login-body">
            <label for="user">Username</label>
            <input type="text" id="user" autocomplete="username" required>
            <label for="pass">Password</label>
            <input type="password" id="pass" autocomplete="current-password" required>
            <button type="submit">Login</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </form>
</div>

<div id="app">
<div class="logout-bar"><button onclick="logout()">Logout</button></div>

<div class="container">

    <header class="header">
        <img class="logo" alt="Thiruvalluvar University logo">
        <div>
            <div class="university-name">Thiruvalluvar University</div>
            <div class="subtitle">Continuous Internal Assessment</div>
        </div>
    </header>

    <main class="content">

        <h1>Semester CIA Internal Mark Calculator</h1>

        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th rowspan="2">S.No</th>
                        <th rowspan="2">Subject Name</th>
                        <th colspan="2">CIA 1</th>
                        <th colspan="2">CIA 2</th>
                        <th colspan="2">CIA 3</th>
                        <th rowspan="2">Internal /25</th>
                    </tr>
                    <tr>
                        <th>Test /50</th>
                        <th>Assignment /10</th>
                        <th>Test /50</th>
                        <th>Assignment /10</th>
                        <th>Test /100</th>
                        <th>Assignment /10</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>

        <div class="buttons">
            <button class="calculate" onclick="calculateMarks()">Calculate CIA marks</button>
            <button class="reset" onclick="resetMarks()">Reset</button>
        </div>


    </main>
</div>
</div>

// ---------- Login ----------
// SHA-256 hash of "username:password" (lowercase username).
// Change it using the steps given in the chat. Do NOT store the plain password here.
const CREDENTIAL_HASH = "1a0d630d371ac660bac29dfa486cd5e7cd17befabe6e6ece8d6be98534416070";
const SESSION_KEY = "cia_logged_in";

// Pure JavaScript SHA-256 (works on http, https and when the file is opened directly)
function sha256(msg) {
    const K = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ];
    const bytes = Array.from(new TextEncoder().encode(msg));
    const bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (bitLen >>> (i * 8)) & 0xff);

    let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));

    for (let o = 0; o < bytes.length; o += 64) {
        const w = new Array(64);
        for (let i = 0; i < 16; i++) {
            w[i] = (bytes[o+i*4] << 24) | (bytes[o+i*4+1] << 16) | (bytes[o+i*4+2] << 8) | bytes[o+i*4+3];
        }
        for (let i = 16; i < 64; i++) {
            const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3);
            const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10);
            w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
        }
        let [a,b,c,d,e,f,g,hh] = H;
        for (let i = 0; i < 64; i++) {
            const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
            const ch = (e & f) ^ (~e & g);
            const t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
            const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
            const maj = (a & b) ^ (a & c) ^ (b & c);
            const t2 = (S0 + maj) | 0;
            hh = g; g = f; f = e; e = (d + t1) | 0;
            d = c; c = b; b = a; a = (t1 + t2) | 0;
        }
        H = H.map((v, i) => (v + [a,b,c,d,e,f,g,hh][i]) | 0);
    }
    return H.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
}

function showApp(on) {
    document.getElementById("app").style.display = on ? "block" : "none";
    document.getElementById("loginScreen").style.display = on ? "none" : "flex";
}

document.getElementById("loginForm").addEventListener("submit", e => {
    e.preventDefault();
    const u = document.getElementById("user").value.trim().toLowerCase();
    const p = document.getElementById("pass").value;
    const err = document.getElementById("loginError");
    if (sha256(u + ":" + p) === CREDENTIAL_HASH) {
        try { sessionStorage.setItem(SESSION_KEY, "yes"); } catch (x) {}
        err.textContent = "";
        document.getElementById("pass").value = "";
        showApp(true);
    } else {
        err.textContent = "தவறான யூசர் நேம் அல்லது பாஸ்வேர்ட்";
    }
});

function logout() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (x) {}
    showApp(false);
}

let remembered = false;
try { remembered = sessionStorage.getItem(SESSION_KEY) === "yes"; } catch (x) {}
showApp(remembered);

const tbody = document.getElementById("rows");
const SUBJECTS = 7;

// Build the 7 subject rows
for (let i = 1; i <= SUBJECTS; i++) {
    tbody.insertAdjacentHTML("beforeend", `
    <tr>
        <td>${i}</td>
        <td><input type="text" class="subject" placeholder="Subject ${i}"></td>
        <td><input type="number" class="c1" min="0" max="50" step="any"></td>
        <td><input type="number" class="a1" min="0" max="10" step="any"></td>
        <td><input type="number" class="c2" min="0" max="50" step="any"></td>
        <td><input type="number" class="a2" min="0" max="10" step="any"></td>
        <td><input type="number" class="c3" min="0" max="100" step="any"></td>
        <td><input type="number" class="a3" min="0" max="10" step="any"></td>
        <td class="result">-</td>
    </tr>`);
}

function calculateMarks() {
    const fields = ["c1", "a1", "c2", "a2", "c3", "a3"];
    const limits = [50, 10, 50, 10, 100, 10];

    for (const row of tbody.querySelectorAll("tr")) {
        const values = fields.map(f => row.querySelector("." + f).value.trim());
        const result = row.querySelector(".result");

        // Skip empty subjects
        if (values.every(v => v === "")) {
            result.textContent = "-";
            continue;
        }

        // All six marks are required
        if (values.some(v => v === "")) {
            alert("Please enter all six marks for each subject.");
            return;
        }

        const marks = values.map(Number);

        if (marks.some((v, i) => !Number.isFinite(v) || v < 0 || v > limits[i])) {
            alert("Please enter valid marks within the given limits.");
            return;
        }

        const [c1, a1, c2, a2, c3, a3] = marks;

        // Convert each CIA test to 10 marks
        const testAverage = ((c1 / 50) * 10 + (c2 / 50) * 10 + (c3 / 100) * 10) / 3;
        const assignmentAverage = (a1 + a2 + a3) / 3;

        // 20 marks scaled to 25
        const finalMark = Number((((testAverage + assignmentAverage) / 20) * 25).toFixed(2));

        const name = row.querySelector(".subject").value.trim() || ("பாடம் " + row.cells[0].textContent);

        result.innerHTML = "";
        const mark = document.createElement("div");
        mark.className = "mark";
        mark.textContent = finalMark + " / 25";

        const tamil = document.createElement("div");
        tamil.className = "tamil";
        tamil.textContent = name + " – அக மதிப்பெண்: " + finalMark + " / 25";

        result.append(mark, tamil);
    }

}

function resetMarks() {
    document.querySelectorAll("input").forEach(i => i.value = "");
    document.querySelectorAll(".result").forEach(r => r.textContent = "-");
}
</script>

</body>
</html>
